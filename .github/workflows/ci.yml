name: CI

# Wann der Workflow laeuft: bei jedem Push auf main und bei Pull Requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -e ".[dev]"

      - name: Linter (ruff)
        run: ruff check src tests scripts

      - name: Typpruefung (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: Frontend (Vue + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Linter (oxlint, ohne Auto-Fix)
        run: npx oxlint .

      - name: Linter (ESLint, ohne Auto-Fix)
        run: npx eslint .

      - name: Typpruefung + Build
        run: npm run build

      - name: Unit-Tests (Vitest)
        run: npx vitest run
