# Beispiel-Konfiguration fuer das Modellbahn-Backend.
#
# Kopieren nach conf/config.toml und an die Anlage anpassen. conf/config.toml
# wird beim Start automatisch geladen und ist von git ignoriert.
#
# Praezedenz (hoechste zuerst):
#   1. Umgebungsvariablen mit Prefix MB_ (z. B. MB_Z21_HOST, MB_LOG_LEVEL)
#   2. conf/config.toml (diese Datei bzw. deine Kopie)
#   3. eingebaute Defaults
#
# Die Schluessel entsprechen 1:1 den Einstellungsnamen.

# IP-Adresse der Z21-Zentrale im lokalen Netz.
z21_host = "192.168.0.111"

# UDP-Port der Zentrale: 21105 (bevorzugt) oder 21106.
z21_port = 21105

# Lokaler UDP-Quellport. 0 = vom OS gewaehlter freier Port (empfohlen).
local_port = 0

# Lokale Bind-Adresse (Interface). Leer = 0.0.0.0 (OS waehlt gemaess Routing).
# Nur in Spezialfaellen fest setzen, z. B. "192.168.0.52".
local_host = ""

# Keep-Alive-/Poll-Intervall in Sekunden (bewusst kurz).
keepalive_interval_s = 5.0

# Log-Level: DEBUG | INFO | WARNING | ERROR.
# DEBUG protokolliert jedes gesendete/empfangene Z21-Paket (ausfuehrlich).
log_level = "INFO"
