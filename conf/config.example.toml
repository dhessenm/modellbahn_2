# Beispiel-Konfiguration fuer das Modellbahn-Backend.
# Kopieren nach conf/config.toml bzw. als .env setzen und an die Anlage anpassen.
# Umgebungsvariablen (Prefix MB_) ueberschreiben diese Werte, z. B. MB_Z21_HOST.

[z21]
# IP-Adresse der Z21-Zentrale im lokalen Netz.
host = "192.168.0.111"
# UDP-Port der Zentrale: 21105 (bevorzugt) oder 21106.
port = 21105
# Lokaler UDP-Quellport (fest, damit die Z21 den Client nach Neustart
# wiedererkennt). 0 = zufaelliger Port.
local_port = 21105

[keepalive]
# Intervall in Sekunden. Bewusst kurz (nicht nur < Z21-Timeout ~60 s): haeufiges
# Pollen stellt die Verbindung schnell und robust her.
interval_s = 5.0
